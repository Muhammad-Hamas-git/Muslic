name: muslic
description: "müslic by dot Studios, a local music player."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Playback engine: gapless, speed, pitch, loudness enhancer, error recovery.
  just_audio: ^0.9.42
  # Background playback + lock screen / notification shade media session.
  just_audio_background: ^0.0.1-beta.13
  # MediaStore querying: songs, duration, album art, dates.
  on_audio_query: ^2.9.0
  # Runtime permissions (READ_MEDIA_AUDIO on 13+, READ_EXTERNAL_STORAGE below).
  permission_handler: ^11.3.1
  # Settings persistence.
  shared_preferences: ^2.3.2
  # Simple, fast state management.
  provider: ^6.1.2
  # Native folder picker for allow/ban lists.
  file_picker: ^8.1.2
  # Marquee for long titles in the player.
  marquee: ^2.3.0
  # Blurring album art for the cached player backgrounds.
  image: ^4.2.0
  # App storage folder for the artwork cache.
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^4.0.0
  # Generates the launcher icons from assets/icon/ (run in CI).
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true

  assets:
    - assets/ui/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: KumbhSans
      fonts:
        - asset: assets/fonts/KumbhSans.ttf
