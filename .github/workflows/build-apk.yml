name: Build müslic APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the platform scaffolding around the shipped sources.
      # flutter create overwrites the manifest, so ours is restored after.
      - name: Scaffold platform files
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/Manifest.xml
          flutter create . --project-name muslic --org app.muslic --platforms android
          cp /tmp/Manifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart

      # just_audio_background needs minSdk 23.
      - name: Raise minSdk to 23
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/flutter\.minSdkVersion/23/g' "$f"
            fi
          done

      # Compatibility fixes for older plugins on current Gradle:
      # missing namespace, and Java/Kotlin JVM target mismatch.
      - name: Apply plugin compatibility fixes
        run: |
          set -e
          if [ -f android/build.gradle.kts ]; then
            echo 'apply(from = "namespace-fix.gradle")' >> android/build.gradle.kts
          else
            echo 'apply from: "namespace-fix.gradle"' >> android/build.gradle
          fi
          echo 'kotlin.jvm.target.validation.mode=IGNORE' >> android/gradle.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      # Publish the build log to the ci-logs branch so it can be read
      # with plain git, even when a run fails.
      - name: Publish build log
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/ 2>/dev/null || echo "no build log" > /tmp/logs/build.log
          cd /tmp/logs
          git init -q && git checkout -q -b ci-logs
          git config user.name "müslic CI" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Publish APK to the apk branch
        shell: bash
        run: |
          mkdir -p /tmp/apk && cp build/app/outputs/flutter-apk/app-release.apk /tmp/apk/muslic.apk
          cd /tmp/apk
          git init -q && git checkout -q -b apk
          git config user.name "müslic CI" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: müslic build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muslic-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
