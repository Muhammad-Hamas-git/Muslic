name: Build müslic

# Builds a signed Play Store bundle (.aab) and installable APKs on every
# push to main. Signing uses the upload key stored in the repository
# secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (see
# PUBLISHING.md). Without them the build still works but is debug-signed,
# which the Play Store rejects; verify.log says which key was used.

on:
  push:
    branches: [main, master]
    paths-ignore: [assets/figma-assets.txt, .github/workflows/fetch-figma-assets.yml]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Every upload to Play needs a higher version code; the run number grows
  # with each build.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the platform scaffolding around the shipped sources. The
      # package name com.dotstudios.muslic comes from --org + project name.
      # flutter create overwrites the manifest, so ours is restored after.
      - name: Scaffold platform files
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/Manifest.xml
          flutter create . --project-name muslic --org com.dotstudios --platforms android
          cp /tmp/Manifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart

      - name: Configure Android project (SDK levels, plugin fixes, signing)
        run: python3 ci/configure_android.py | tee configure.log

      - name: Install upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "storeFile=$RUNNER_TEMP/upload.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=upload"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > android/key.properties
            echo "Release signing: dot Studios upload key"
          else
            echo "::warning::No upload key secrets set; this build is debug-signed and cannot go to the Play Store."
          fi

      - name: Resolve dependencies and app icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze, test, build
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          flutter test --update-goldens 2>&1 | tee test.log || true
          flutter build appbundle --release --build-number "$BUILD_NUMBER" 2>&1 | tee build.log
          flutter build apk --release --build-number "$BUILD_NUMBER" 2>&1 | tee -a build.log
          mkdir -p /tmp/out
          cp build/app/outputs/bundle/release/app-release.aab /tmp/out/muslic.aab
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/out/muslic-universal.apk
          # Smaller APK for modern phones (64-bit ARM only).
          flutter build apk --release --build-number "$BUILD_NUMBER" --split-per-abi --target-platform android-arm64 2>&1 | tee -a build.log
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/out/muslic-arm64.apk

      # Checks the Play Store cares about: package name, version, target
      # SDK, permissions, signing certificate, 16 KB page alignment.
      - name: Verify release
        if: always()
        shell: bash
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "== Badging (universal APK)"
            "$BT/aapt2" dump badging /tmp/out/muslic-universal.apk | grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|application-label:|launchable"
            echo
            echo "== APK signature"
            "$BT/apksigner" verify --print-certs /tmp/out/muslic-universal.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
            echo
            echo "== AAB signature"
            keytool -printcert -jarfile /tmp/out/muslic.aab | grep -E "Owner|SHA256:" | head -2
            echo
            echo "== 16 KB page alignment (Play requirement for Android 15+)"
            "$BT/zipalign" -c -P 16 -v 4 /tmp/out/muslic-universal.apk | tail -1
            echo
            echo "== Sizes"
            ls -la /tmp/out
          } 2>&1 | tee verify.log

      # Publish logs to the ci-logs branch so they can be read with plain
      # git, even when a run fails.
      - name: Publish build log
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logs
          cp build.log /tmp/logs/ 2>/dev/null || echo "no build log" > /tmp/logs/build.log
          cp analyze.log test.log verify.log configure.log /tmp/logs/ 2>/dev/null || true
          cp -r test/screenshots /tmp/logs/ 2>/dev/null || true
          cp -r test/failures /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs
          git init -q && git checkout -q -b ci-logs
          git config user.name "müslic CI" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Publish builds to the apk branch
        shell: bash
        run: |
          mkdir -p /tmp/apk
          cp /tmp/out/muslic-arm64.apk /tmp/apk/muslic.apk
          cp /tmp/out/muslic.aab /tmp/apk/muslic.aab
          cd /tmp/apk
          git init -q && git checkout -q -b apk
          git config user.name "müslic CI" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Build ${BUILD_NUMBER} for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: müslic build ${{ github.run_number }}
          files: |
            /tmp/out/muslic.aab
            /tmp/out/muslic-arm64.apk
            /tmp/out/muslic-universal.apk
